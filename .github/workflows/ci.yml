name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        run: bun run typecheck

      - name: Build
        run: bun run build

      - name: Test server part, sidebar and package exports
        run: bun test

      - name: Verify dist output
        run: |
          for entry in server tui cli package-tui; do
            test -f "dist/$entry.js" || (echo "dist/$entry.js missing" && exit 1)
            test -f "dist/$entry.d.ts" || (echo "dist/$entry.d.ts missing" && exit 1)
          done
